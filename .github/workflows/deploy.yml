name: Deploy

# Deploys main to Cloudflare Workers once CI has passed on the pushed commit.
# Skipped until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets
# exist (the Worker's own secrets stay in Cloudflare).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy skipped (no Cloudflare secrets)."
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'yes'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.run == 'yes'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'yes'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.run == 'yes'
      - run: pnpm run deploy
        if: steps.gate.outputs.run == 'yes'
