name: Benchmark

# The full benchmark and the red-team suite for one model. With release: true,
# the reports are committed (web/public/benchmark/latest.json and
# web/public/security/latest.json).
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id (benchmark/src/models.ts)"
        default: geminiLite
      tasks:
        description: "smoke, all, or task ids / categories"
        default: all
      redteam:
        description: "Red-team defenses: on, off, each, or none"
        default: each
      release:
        description: "Commit the reports"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: benchmark/data
          key: bench-data-${{ hashFiles('benchmark/datasets.json', 'benchmark/src/messy.ts') }}
      - uses: actions/cache/restore@v6
        with:
          path: benchmark/.cache
          key: bench-calls-${{ github.run_id }}
          restore-keys: bench-calls-
      - run: pnpm bench:data
      - run: pnpm bench --model "$MODEL" --tasks "$TASKS"
        env:
          MODEL: ${{ inputs.model }}
          TASKS: ${{ inputs.tasks }}
      - run: pnpm bench:report >> "$GITHUB_STEP_SUMMARY"
        if: ${{ !cancelled() }}
      - run: pnpm --filter @browser-analyst/web exec playwright install --with-deps chromium
        if: ${{ !cancelled() && inputs.redteam != 'none' }}
      - run: pnpm redteam --model "$MODEL" --defenses "$DEFENSES"
        if: ${{ !cancelled() && inputs.redteam != 'none' }}
        env:
          MODEL: ${{ inputs.model }}
          DEFENSES: ${{ inputs.redteam }}
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() }}
        with:
          path: benchmark/.cache
          key: bench-calls-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bench-results
          path: benchmark/results/
      - name: Commit the reports
        if: inputs.release
        env:
          MODEL: ${{ inputs.model }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/benchmark/latest.json web/public/security/latest.json
          git commit -m "chore(bench): publish $MODEL results" || exit 0
          git push
