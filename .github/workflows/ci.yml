name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      # Not -s: pnpm's silent reporter hides recursive tsc errors.
      - run: pnpm typecheck
      - run: pnpm -s test
      - run: pnpm -s build
      # Secret values must never ship to browsers: Groq (gsk_), Google (AIza),
      # and Turnstile secret keys (0x4…, ~35 chars; public site keys are ~22).
      - name: No secrets in the web bundle
        run: |
          if grep -rEl 'gsk_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|0x4[A-Za-z0-9_-]{28,}' web/dist; then
            echo "::error::secret-like value in web/dist"
            exit 1
          fi
      - run: pnpm --filter @browser-analyst/web exec playwright install --with-deps chromium
      - run: pnpm -s e2e
      # A scripted model that obeys every injection, against the build with
      # the production CSP: nothing may leave the browser, and the blocked
      # attempts must show in the trace. No model calls, so no secrets.
      - run: pnpm redteam --model hijacked --defenses on --check --no-build --no-report

  # The smoke benchmark (15 fixed tasks) on the production agent code, gated on
  # benchmark/baseline.json. Model calls replay from the Actions cache, so it
  # only spends free-tier quota when the agent's messages change. Skipped for
  # forks (no secrets) and until a baseline is committed.
  bench-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - id: gate
        run: |
          if [ -n "$GEMINI_API_KEY" ] && [ -f benchmark/baseline.json ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Smoke benchmark skipped (no key or no baseline)."
          fi
      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.run == 'yes'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'yes'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.run == 'yes'
      - uses: actions/cache@v6
        if: steps.gate.outputs.run == 'yes'
        with:
          path: benchmark/data
          key: bench-data-${{ hashFiles('benchmark/datasets.json', 'benchmark/src/messy.ts') }}
      - uses: actions/cache/restore@v6
        if: steps.gate.outputs.run == 'yes'
        with:
          path: benchmark/.cache
          key: bench-calls-${{ github.run_id }}
          restore-keys: bench-calls-
      - run: pnpm bench:data
        if: steps.gate.outputs.run == 'yes'
      - run: pnpm bench --model geminiLite --tasks smoke
        if: steps.gate.outputs.run == 'yes'
      - name: Report and gate (smoke success >= baseline - 5 points)
        if: ${{ !cancelled() && steps.gate.outputs.run == 'yes' }}
        run: pnpm bench:report --gate --markdown bench-report.md
      - name: Comment on the PR
        if: ${{ !cancelled() && steps.gate.outputs.run == 'yes' && github.event_name == 'pull_request' && hashFiles('bench-report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file bench-report.md --edit-last --create-if-none
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && steps.gate.outputs.run == 'yes' }}
        with:
          path: benchmark/.cache
          key: bench-calls-${{ github.run_id }}
